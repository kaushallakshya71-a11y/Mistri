<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistri – Electrical/Electronic Appliance Repair Management</title>
    <meta name="description"
        content="Mistri is a smart repair management platform for electrical/electronic appliance shops. Track fan, cooler, mixer, motor, geyser & pump repairs with AI cost estimates.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=19">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <!-- App Shell -->
    <div id="app">
        <!-- Loading Screen -->
        <div id="loading-screen" class="loading-screen">
            <div class="loading-logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Mistri</span>
            </div>
            <div class="loading-bar">
                <div class="loading-bar-fill"></div>
            </div>
        </div>

        <!-- Navbar -->
        <nav class="navbar" id="navbar" style="display:none">
            <div class="navbar-brand" onclick="router.navigate('/')">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Mistri</span>
            </div>
            <div class="navbar-links" id="navbar-links"></div>
            <div class="navbar-actions">
                <button class="notif-btn" id="notif-btn" title="Notifications" onclick="openNotifPanel()">
                    🔔 <span class="notif-badge" id="notif-badge" style="display:none">0</span>
                </button>
                <button class="theme-btn" id="theme-btn" title="Toggle theme">🌙</button>
                <button class="btn btn-outline btn-sm nav-desktop-only" id="nav-logout-btn" onclick="logout()" title="Logout" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:0.85rem;color:var(--text-muted);border-color:var(--border)">
                    🚪 Logout
                </button>
                <div class="user-menu nav-desktop-only">
                    <div class="user-avatar" id="user-avatar" onclick="toggleUserDropdown(event)">A</div>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="dropdown-name" id="dropdown-name"></div>
                        <div class="dropdown-role" id="dropdown-role"></div>
                        <hr>
                        <button onclick="logout()">🚪 Logout</button>
                    </div>
                </div>
                <!-- Mobile Navigation Toggle Button -->
                <button class="mobile-nav-toggle" id="mobile-nav-toggle" onclick="toggleMobileNav(event)" aria-label="Toggle Navigation Menu">
                    <span id="mobile-nav-icon">☰</span>
                </button>
            </div>
        </nav>

        <!-- Mobile Navigation Drawer -->
        <div class="mobile-nav-drawer" id="mobile-nav-drawer">
            <div class="mobile-nav-header">
                <div class="navbar-brand">
                    <span class="logo-icon">⚡</span>
                    <span class="logo-text">Mistri</span>
                </div>
                <button class="mobile-nav-close" onclick="closeMobileNav()" aria-label="Close navigation">✕</button>
            </div>
            <div class="mobile-nav-user" id="mobile-nav-user">
                <div class="user-avatar" id="mobile-user-avatar">A</div>
                <div class="mobile-user-info">
                    <div class="mobile-user-name" id="mobile-user-name">User</div>
                    <span class="badge" id="mobile-user-role-badge">Role</span>
                </div>
            </div>
            <div class="mobile-nav-links" id="mobile-nav-links">
                <!-- Injected dynamically by updateNavbar -->
            </div>
            <div class="mobile-nav-footer">
                <button class="btn btn-outline w-full" id="mobile-theme-btn" onclick="toggleTheme()" style="margin-bottom:8px;justify-content:center">
                    🌙 Toggle Dark/Light
                </button>
                <button class="btn btn-danger w-full" onclick="closeMobileNav(); logout();" style="justify-content:center">
                    🚪 Logout
                </button>
            </div>
        </div>
        <div class="mobile-nav-overlay" id="mobile-nav-overlay" onclick="closeMobileNav()"></div>

        <!-- Notifications Panel -->
        <div class="notif-panel" id="notif-panel" style="display:none">
            <div class="notif-panel-header">
                <h3>Notifications</h3>
                <button onclick="markAllRead()">Mark all read</button>
            </div>
            <div id="notif-list"></div>
        </div>
        <div class="notif-overlay" id="notif-overlay" onclick="closeNotifPanel()" style="display:none"></div>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content">
            <!-- Views injected by JS router -->
        </main>

        <!-- Toast notifications -->
        <div id="toast-container"></div>
    </div>

    <script src="/static/js/i18n.js?v=19"></script>
    <script src="/static/js/api.js?v=19"></script>
    <script src="/static/js/router.js?v=19"></script>
    <script src="/static/js/views/auth.js?v=19"></script>
    <script src="/static/js/views/customer.js?v=19"></script>
    <script src="/static/js/views/admin.js?v=19"></script>
    <script src="/static/js/views/staff.js?v=19"></script>
    <script src="/static/js/views/shop.js?v=19"></script>
    <script src="/static/js/app.js?v=19"></script>
    <script>
        // Inline safety fallback: guarantees loading screen removal regardless of network caching
        setTimeout(function() {
            var loader = document.getElementById('loading-screen');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.3s ease';
                setTimeout(function() { if (loader && loader.parentNode) loader.remove(); }, 300);
            }
            if (window.router && typeof window.router.start === 'function') {
                try { window.router.start(); } catch (e) { console.error(e); }
            }
        }, 1000);
    </script>
</body>

</html>
